[package]
name = "codex-usage-monit"
version = "0.2.7"
edition = "2024"
description = "Local-first TUI and CLI monitor for Codex tasks, token usage, and quota windows"
license = "MIT"
repository = "https://github.com/ghostroller/codex-usage-monit"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
insta = "1.48"
portable-pty = "0.9"
pretty_assertions = "1.4"
tempfile = "3.14"
vt100 = "0.15"
