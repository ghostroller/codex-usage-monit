[package]
name = "codex-usage-monit"
version = "0.3.1"
edition = "2024"
description = "Local-first TUI and CLI monitor for Codex tasks, token usage, and quota windows"
license = "MIT"
repository = "https://github.com/ghostroller/codex-usage-monit"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
flate2 = "1.1"
getrandom = "0.4"
hmac = "0.12"
quick-xml = "0.39"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-width = "0.2"
unicode-segmentation = "1.12"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
insta = "1.48"
portable-pty = "0.9"
pretty_assertions = "1.4"
tempfile = "3.14"
vt100 = "0.15"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
