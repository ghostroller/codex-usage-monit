name: CI
run-name: CI / ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA at the selected branch head
        required: true
        type: string
      local_results:
        description: Local Linux/Windows results and log paths, or explicit blockers
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Verify checkpoint
    uses: ./.github/workflows/verify.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
      local_results: ${{ inputs.local_results }}
