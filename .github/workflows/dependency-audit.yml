name: Dependency audit

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Verify the requested commit when called by CI
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatched branch moved or expected_sha is invalid."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: Install pinned advisory checker
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Check all locked dependencies and advisory warnings
        run: cargo audit --deny warnings
