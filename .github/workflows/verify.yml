name: Shared verification

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Exact event commit to verify
        required: true
        type: string
      local_results:
        description: Local test evidence or release preparation notes
        required: false
        type: string
        default: Release validation at the version tag

permissions:
  contents: read

jobs:
  verify:
    name: Verify Linux
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Verify the requested commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatched branch moved or expected_sha is invalid; no tests were run."
            exit 1
          fi

      - name: Record verification context
        env:
          LOCAL_RESULTS: ${{ inputs.local_results }}
        run: |
          printf 'Commit: `%s`\n\nLocal results or blockers:\n\n%s\n' "$GITHUB_SHA" "$LOCAL_RESULTS" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Run shared Unix verification pipeline
        run: sh scripts/verify-unix.sh

      - name: Upload TUI layout gallery
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tui-layout-gallery
          path: target/tui-gallery/*.svg
          if-no-files-found: warn

  verify-macos:
    name: Verify macOS
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Verify the requested commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatched branch moved or expected_sha is invalid; no tests were run."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Run shared Unix verification pipeline
        run: sh scripts/verify-unix.sh

  verify-windows:
    name: Verify Windows
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Verify the requested commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ "$EXPECTED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatched branch moved or expected_sha is invalid; no tests were run."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy

      - name: Run Windows verification pipeline
        shell: pwsh
        run: .\scripts\windows\verify.ps1

  dependency-audit:
    name: Check dependency advisories
    uses: ./.github/workflows/dependency-audit.yml
    with:
      expected_sha: ${{ inputs.expected_sha }}
