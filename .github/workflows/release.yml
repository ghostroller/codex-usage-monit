name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.evidence.outputs.reuse }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Match tag to Cargo package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Look up complete verification for this commit
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: python3 scripts/release_verification.py --repo "$RELEASE_REPOSITORY" --sha "$RELEASE_SHA"

  verify:
    name: Verify release
    needs: validate-tag
    if: needs.validate-tag.outputs.reuse == 'false'
    uses: ./.github/workflows/verify.yml
    with:
      expected_sha: ${{ github.sha }}

  audit-reused-verification:
    name: Refresh dependency audit
    needs: validate-tag
    if: needs.validate-tag.outputs.reuse == 'true'
    uses: ./.github/workflows/dependency-audit.yml
    with:
      expected_sha: ${{ github.sha }}

  verification-gate:
    name: Require complete release verification
    needs: [validate-tag, verify, audit-reused-verification]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Accept only a complete verification path
        env:
          TAG_RESULT: ${{ needs.validate-tag.result }}
          REUSE: ${{ needs.validate-tag.outputs.reuse }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          AUDIT_RESULT: ${{ needs.audit-reused-verification.result }}
        run: |
          test "$TAG_RESULT" = success
          if [ "$REUSE" = true ]; then
            test "$VERIFY_RESULT" = skipped
            test "$AUDIT_RESULT" = success
          else
            test "$REUSE" = false
            test "$VERIFY_RESULT" = success
            test "$AUDIT_RESULT" = skipped
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verification-gate
    if: ${{ always() && !cancelled() && needs.verification-gate.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy --target "$TARGET"

      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Strip and package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="target/$TARGET/release/codex-usage-monit"
          strip "$binary"
          mkdir -p dist
          tar -czf "dist/codex-usage-monit-$TARGET.tar.gz" -C "$(dirname "$binary")" codex-usage-monit

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/$env:TARGET/release/codex-usage-monit.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $binary "dist/codex-usage-monit-$env:TARGET.exe"

      - name: Check the Unix release binary
        if: runner.os != 'Windows'
        run: python3 scripts/check-release-binary.py "target/$TARGET/release/codex-usage-monit"

      - name: Check the Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/check-release-binary.py "dist/codex-usage-monit-$env:TARGET.exe"

      - name: Upload packaged binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/codex-usage-monit-${{ matrix.target }}.tar.gz
            dist/codex-usage-monit-${{ matrix.target }}.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cp scripts/install.sh dist/install.sh
          cd dist
          sha256sum codex-usage-monit-*.tar.gz codex-usage-monit-*.exe install.sh | sort -k 2 > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "codex-usage-monit $GITHUB_REF_NAME"
          --generate-notes
